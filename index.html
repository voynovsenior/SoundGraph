<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FREQ // Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;900&display=swap');

        :root {
            --bg: #050507;
            --surface: #101016;
            --surface-hover: #1c1c28;
            --border: #2a2a3d;
            --text: #f3f3f6;
            --muted: #808099;
            --accent: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-shell {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 850px;
            background: #0c0c10;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 15px;
            color: var(--text);
        }

        .logo span {
            color: var(--accent);
        }

        .sys-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            background: var(--surface);
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .settings-scroll {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
            padding-right: 2px;
        }

        .step-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .opt-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            transition: 0.1s;
        }

        .opt-btn:active {
            transform: scale(0.97);
        }

        .opt-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--text);
        }

        .action-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: 0 0 20px var(--accent-glow);
            text-align: center;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .tracklist {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        .track-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .track-item:active {
            transform: scale(0.98);
        }

        .track-item.playing {
            border-color: var(--accent);
            background: rgba(255, 0, 85, 0.1);
        }

        .track-thumb {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }

        .track-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .track-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
        }

        .player-bar {
            border-top: 1px solid var(--border);
            padding-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            width: 40px;
            height: 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .ctrl-btn:active {
            transform: scale(0.95);
        }

        .play-master-btn {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-size: 15px;
        }

        .current-playing-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .cp-title {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cp-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--muted);
            margin-top: 2px;
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="app-shell">
        <div class="topbar">
            <div class="logo">FREQ<span>//</span>ENGINE</div>
            <div class="sys-status" id="sys-status">IDLE</div>
        </div>

        <div class="settings-scroll">
            <div>
                <div class="step-label">1. Интенсивность / Напор:</div>
                <div class="options-grid" id="intensity-opts">
                    <button class="opt-btn active" data-val="slow">🧊 Медленно</button>
                    <button class="opt-btn" data-val="mid">⚡ Кач</button>
                    <button class="opt-btn" data-val="fast">🔥 Экстрим</button>
                </div>
            </div>

            <div>
                <div class="step-label">2. Саунд-дизайн и Жанр:</div>
                <div class="options-grid" id="genre-opts">
                    <button class="opt-btn active" data-val="phonk">🏎️ Drift Phonk</button>
                    <button class="opt-btn" data-val="rage">🩸 Rage / Trap</button>
                    <button class="opt-btn" data-val="witch">🌑 Witch House</button>
                    <button class="opt-btn" data-val="cyber">🔌 Industrial</button>
                    <button class="opt-btn" data-val="ambient">🌌 Dark Ambient</button>
                    <button class="opt-btn" data-val="lofi">📼 Lo-Fi Dystopia</button>
                </div>
            </div>
        </div>

        <button class="action-btn" id="generate-btn">ПОДОБРАТЬ ВАЙБ (ЗАПУСТИТЬ)</button>

        <div class="tracklist" id="tracklist">
            <div style="text-align:center; color:var(--muted); margin-top:40px; font-size:11px; font-family:JetBrains Mono;">Нажми кнопку выше</div>
        </div>

        <div class="player-bar">
            <button class="ctrl-btn" id="prev-btn">⏮</button>
            <button class="ctrl-btn play-master-btn" id="master-play-btn">▶</button>
            <button class="ctrl-btn" id="next-btn">⏭</button>
            <div class="current-playing-info">
                <div class="cp-title" id="cp-title">Трек не выбран</div>
                <div class="cp-sub">
                    <span id="cp-author">Ожидание...</span>
                    <span id="cp-time">0:00 / 0:00</span>
                </div>
            </div>
        </div>
    </div>

        // Переключение настроек
        function initSelectors(containerId, callback) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.opt-btn').forEach(btn => {
                btn.onclick = (e) => {
                    container.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    callback(e.currentTarget.getAttribute('data-val'));
                };
            });
        }

        initSelectors('intensity-opts', (val) => selectedIntensity = val);
        initSelectors('genre-opts', (val) => selectedGenre = val);

        const generateBtn = document.getElementById('generate-btn');
        const sysStatus = document.getElementById('sys-status');
        const tracklistEl = document.getElementById('tracklist');

            generateBtn.textContent = "ГЕНЕРАЦИЯ...";
