<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FREQ // CORE ENGINE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;900&display=swap');

        :root {
            --bg: #030305;
            --surface: #0d0d12;
            --surface-hover: #161622;
            --border: #222230;
            --text: #f0f0f5;
            --muted: #707085;
            --accent: #00f5d4;
            --accent-glow: rgba(0, 245, 212, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-shell {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 5, 0.95);
            display: flex;
            flex-direction: column;
            padding: 14px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 14px;
            color: var(--text);
        }

        .logo span {
            color: var(--accent);
        }

        .sys-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--accent);
            background: var(--surface);
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .settings-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .step-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .options-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }

        .opt-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 4px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease;
        }

        .opt-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--text);
        }

        .action-btn {
            background: var(--accent);
            color: #030305;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            margin-bottom: 12px;
            box-shadow: 0 0 20px var(--accent-glow);
            text-align: center;
            flex-shrink: 0;
        }

        .tracklist {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 6px 0;
        }

        .tracklist::-webkit-scrollbar {
            width: 3px;
        }
        .tracklist::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .track-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex-shrink: 0;
            transition: border-color 0.15s;
        }

        .track-item.playing {
            border-color: var(--accent);
            background: rgba(0, 245, 212, 0.05);
        }

        .track-thumb {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            object-fit: cover;
            background: var(--border);
            flex-shrink: 0;
        }

        .track-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .track-name {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .track-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
        }

        .player-bar {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 4px;
        }

        .ctrl-btn {
            width: 40px;
            height: 40px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .play-master-btn {
            background: var(--accent);
            border-color: var(--accent);
            color: #030305;
            font-size: 15px;
            font-weight: bold;
        }

        .current-playing-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .cp-title {
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cp-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: var(--muted);
            margin-top: 2px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="app-shell">
        <div class="topbar">
            <div class="logo">FREQ<span>//</span>ENGINE</div>
            <div class="sys-status" id="sys-status">STANDBY</div>
        </div>

        <div class="settings-container">
            <div>
                <div class="step-label">1. Интенсивность:</div>
                <div class="options-grid" id="intensity-opts">
                    <button class="opt-btn active" data-val="slow">🧊 60 BPM</button>
                    <button class="opt-btn" data-val="mid">⚡ 140 BPM</button>
                    <button class="opt-btn" data-val="fast">🔥 180+ BPM</button>
                </div>
            </div>

            <div>
                <div class="step-label">2. Саунд-дизайн / Вайб:</div>
                <div class="options-grid-2" id="genre-opts">
                    <button class="opt-btn active" data-val="phonk">🏎️ Drift Phonk</button>
                    <button class="opt-btn" data-val="rage">🩸 Rage / Trap</button>
                    <button class="opt-btn" data-val="witch">🌑 Witch House</button>
                    <button class="opt-btn" data-val="cyber">🔌 Industrial</button>
                    <button class="opt-btn" data-val="ambient">🌌 Dark Ambient</button>
                    <button class="opt-btn" data-val="lofi">📼 Lo-Fi Dystopia</button>
                </div>
            </div>
        </div>

        <button class="action-btn" id="generate-btn">ПОДОБРАТЬ ВАЙБ (ЗАПУСТИТЬ)</button>

        <div class="tracklist" id="tracklist">
            <div style="text-align:center; color:var(--muted); margin:auto; font-size:10px; font-family:JetBrains Mono;">Нажми кнопку подбора выше</div>
        </div>

        <div class="player-bar">
            <button class="ctrl-btn" id="prev-btn">⏮</button>
            <button class="ctrl-btn play-master-btn" id="master-play-btn">▶</button>
            <button class="ctrl-btn" id="next-btn">⏭</button>
            <div class="current-playing-info">
                <div class="cp-title" id="cp-title">Трек не выбран</div>
                <div class="cp-sub">
                    <span id="cp-author">Ожидание...</span>
                    <span id="cp-time">0:00 / 0:00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const database = [
            { name: "MURDER IN MY MIND", author: "Kordhell / Phonk", genre: "phonk", duration: "2:15", thumb: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=100&auto=format&fit=crop&q=60", url: "https://upload.wikimedia.org/wikipedia/commons/3/3d/Electro_Theque.ogg" },
            { name: "RAAGE SYSTEM", author: "Ken Carson Style", genre: "rage", duration: "1:58", thumb: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=100&auto=format&fit=crop&q=60", url: "https://upload.wikimedia.org/wikipedia/commons/b/b2/Cyberpunk_Dark_Electro.ogg" },
            { name: "EPITAPH GATES", author: "Witch House", genre: "witch", duration: "3:40", thumb: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=100&auto=format&fit=crop&q=60", url: "https://upload.wikimedia.org/wikipedia/commons/8/8b/Classical_guitar_gros_miracle.ogg" },
            { name: "INDUSTRIAL TOXICITY", author: "Gesaffelstein", genre: "cyber", duration: "2:50", thumb: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=100&auto=format&fit=crop&q=60", url: "https://upload.wikimedia.org/wikipedia/commons/c/c8/Example.ogg" },
            { name: "VOID LOST SIGNALS", author: "Dark Ambient", genre: "ambient", duration: "4:12", thumb: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=100&auto=format&fit=crop&q=60", url: "https://upload.wikimedia.org/wikipedia/commons/b/b2/Cyberpunk_Dark_Electro.ogg" },
            { name: "GLITCHED CASSETTE", author: "Lo-Fi Dystopia", genre: "lofi", duration: "2:30", thumb: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=60", url: "https://upload.wikimedia.org/wikipedia/commons/3/3d/Electro_Theque.ogg" }
        ];

        let currentPlaylist = [];
        let currentIndex = 0;
        const audio = new Audio();
        audio.crossOrigin = "anonymous";

        let selectedIntensity = 'slow';
        let selectedGenre = 'phonk';

        function setupSelectors(containerId, callback) {
            const container = document.getElementById(containerId);
            const buttons = container.querySelectorAll('.opt-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    buttons.forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    callback(e.currentTarget.getAttribute('data-val'));
                });
            });
        }

        setupSelectors('intensity-opts', (val) => { selectedIntensity = val; });
        setupSelectors('genre-opts', (val) => { selectedGenre = val; });

        const generateBtn = document.getElementById('generate-btn');
        const sysStatus = document.getElementById('sys-status');
        const tracklistEl = document.getElementById('tracklist');
        const cpTitle = document.getElementById('cp-title');
        const cpAuthor = document.getElementById('cp-author');
        const cpTime = document.getElementById('cp-time');
        const masterPlayBtn = document.getElementById('master-play-btn');

        // Прямой запуск по клику пользователя — сбрасывает блокировку мобильного браузера
        generateBtn.addEventListener('click', () => {
            sysStatus.textContent = "ONLINE";
            
            const matched = database.filter(t => t.genre === selectedGenre);
            currentPlaylist = [];

            for (let i = 1; i <= 50; i++) {
                const template = matched.length > 0 ? matched[Math.floor(Math.random() * matched.length)] : database[0];
                currentPlaylist.push({
                    ...template,
                    name: `${template.name} [${selectedIntensity.toUpperCase()} #${i}]`
                });
            }

            renderTracks();
            playTrack(0);
        });

        function renderTracks() {
            tracklistEl.innerHTML = '';
            currentPlaylist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'track-item';
                if (currentIndex === index && !audio.paused) item.classList.add('playing');

                item.innerHTML = `
                    <img class="track-thumb" src="${track.thumb}" alt="">
                    <div class="track-info">
                        <div class="track-name">${track.name}</div>
                        <div class="track-meta">
                            <span>${track.author}</span>
                            <span>${track.duration}</span>
                        </div>
                    </div>
                `;

                item.addEventListener('click', () => {
                    playTrack(index);
                });

                tracklistEl.appendChild(item);
            });
        }

        function playTrack(index) {
            if (currentPlaylist.length === 0) return;
            currentIndex = index;
            if (currentIndex >= currentPlaylist.length) currentIndex = 0;

            const track = currentPlaylist[currentIndex];
            audio.src = track.url;
            audio.load();

            audio.play().then(() => {
                masterPlayBtn.textContent = "⏸";
                sysStatus.textContent = "PLAYING";
                cpTitle.textContent = track.name;
                cpAuthor.textContent = track.author;
                renderTracks();
            }).catch(e => {
                console.error("Playback error:", e);
                sysStatus.textContent = "TAP PLAY";
                masterPlayBtn.textContent = "▶";
            });
        }

        audio.addEventListener('ended', () => {
            playTrack(currentIndex + 1);
        });

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration)) {
                const curM = Math.floor(audio.currentTime / 60);
                const curS = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
                const durM = Math.floor(audio.duration / 60);
                const durS = Math.floor(audio.duration % 60).toString().padStart(2, '0');
                cpTime.textContent = `${curM}:${curS} / ${durM}:${durS}`;
            }
        });

        masterPlayBtn.addEventListener('click', () => {
            if (currentPlaylist.length === 0) {
                sysStatus.textContent = "GENERATE FIRST";
                return;
            }
            if (!audio.src) {
                playTrack(0);
                return;
            }
            if (audio.paused) {
                audio.play().then(() => {
                    masterPlayBtn.textContent = "⏸";
                    sysStatus.textContent = "PLAYING";
                }).catch(() => {});
            } else {
                audio.pause();
                masterPlayBtn.textContent = "▶";
                sysStatus.textContent = "PAUSED";
            }
            renderTracks();
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            playTrack(currentIndex + 1);
        });

        document.getElementById('prev-btn').addEventListener('click', () => {
            playTrack(currentIndex - 1 >= 0 ? currentIndex - 1 : currentPlaylist.length - 1);
        });

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let step = 0;
        function animate() {
            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, width, height);

            const isPlaying = !audio.paused;
            step += isPlaying ? 0.04 : 0.008;

            ctx.lineWidth = 1.5;
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.strokeStyle = isPlaying ? `rgba(0, 245, 212, ${0.12 + i*0.04})` : `rgba(112, 112, 133, 0.04)`;
                
                for (let x = 0; x < width; x += 15) {
                    const y = height / 2 + Math.sin(x * 0.003 + step + i * 0.6) * (isPlaying ? 50 : 15);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
