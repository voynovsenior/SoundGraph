<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FREQ // Vibe Engine v2.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;900&display=swap');

        :root {
            --bg: #050507;
            --surface: #101016;
            --surface-hover: #1a1a24;
            --border: #262636;
            --text: #f3f3f6;
            --muted: #78788c;
            --accent: #ff2a5f;
            --accent-glow: rgba(255, 42, 95, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 850px;
            background: rgba(16, 16, 22, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 15px;
            color: var(--text);
        }

        .logo span {
            color: var(--accent);
        }

        .sys-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            background: var(--surface);
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        /* Контейнер шагов настройки */
        .wizard-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .step-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .opt-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .opt-btn:hover {
            border-color: var(--text);
            color: var(--text);
        }

        .opt-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--text);
        }

        .action-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 4px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Треклист */
        .tracklist {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
        }

        .tracklist::-webkit-scrollbar {
            width: 3px;
        }
        .tracklist::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .track-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .track-item:hover {
            background: var(--surface-hover);
            border-color: var(--muted);
        }

        .track-item.playing {
            border-color: var(--accent);
            background: rgba(255, 42, 95, 0.05);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .track-thumb {
            width: 38px;
            height: 38px;
            background: var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .track-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .track-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .track-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
        }

        /* Плеер снизу */
        .player-bar {
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-master-btn {
            width: 42px;
            height: 42px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
        }

        .current-playing-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .cp-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cp-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }

        .spectrum {
            display: flex;
            gap: 2px;
            height: 16px;
            align-items: flex-end;
        }

        .s-bar {
            width: 3px;
            background: var(--accent);
            height: 4px;
            border-radius: 1px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="app-shell">
        <div class="topbar">
            <div class="logo">FREQ<span>//</span>WIZARD</div>
            <div class="sys-status" id="status-text">CONFIG</div>
        </div>

        <div class="wizard-container">
            <div class="step-label">1. Выбери интенсивность потока:</div>
            <div class="options-grid" id="intensity-opts">
                <button class="opt-btn active" data-val="chill">🌿 Спокойное</button>
                <button class="opt-btn" data-val="hard">🔥 Жесткое / Кач</button>
            </div>

            <div class="step-label">2. Выбери атмосферу (вайб):</div>
            <div class="options-grid" id="vibe-opts">
                <button class="opt-btn active" data-val="night">🌃 Ночной город</button>
                <button class="opt-btn" data-val="code">💻 Фокус / Код</button>
                <button class="opt-btn" data-val="drift">🏎️ Дрифт / Трасса</button>
                <button class="opt-btn" data-val="cloud">☁️ Облачный рэп</button>
            </div>

            <button class="action-btn" id="generate-btn">СГЕНЕРИРОВАТЬ ПЛЕЙЛИСТ</button>
        </div>

        <div class="tracklist" id="tracklist">
            <div style="text-align:center; color:var(--muted); margin-top:30px; font-size:12px; font-family:JetBrains Mono;">Настрой параметры выше и нажми генерацию</div>
        </div>

        <div class="player-bar">
            <button class="play-master-btn" id="master-play-btn">▶</button>
            <div class="current-playing-info">
                <div class="cp-title" id="cp-title">Ничего не играет</div>
                <div class="cp-status" id="cp-sub">Ожидание выбора</div>
            </div>
            <div class="spectrum" id="spectrum">
                <div class="s-bar"></div><div class="s-bar"></div><div class="s-bar"></div><div class="s-bar"></div><div class="s-bar"></div>
            </div>
        </div>
    </div>

    <script>
        const database = [
            { name: "HOME - Resonance", intensity: "chill", vibe: "code night", author: "Synthwave", url: "https://p.scdn.co/mp3-preview/32578b871c53e8392186835a297924d550089e1b?cid=9448f212852243e8bb24765d70f2f354" },
            { name: "Kordhell - Murder In My Mind", intensity: "hard", vibe: "drift night", author: "Drift Phonk", url: "https://p.scdn.co/mp3-preview/882e340e4fbc8ea9f9e30a514d7ca656f7ef534a?cid=9448f212852243e8bb24765d70f2f354" },
            { name: "Kizaru - Дежавю", intensity: "hard", vibe: "night cloud", author: "Hip-Hop", url: "https://p.scdn.co/mp3-preview/452295696d5a11c19550b07548ec2a55928d3e38?cid=9448f212852243e8bb24765d70f2f354" },
            { name: "DVRST - Close Eyes", intensity: "chill", vibe: "drift code", author: "Phonk Wave", url: "https://p.scdn.co/mp3-preview/c8a245d8b8d946d84f2aa34b1235b2e3f5b08542?cid=9448f212852243e8bb24765d70f2f354" },
            { name: "Travis Scott - FE!N (Snippet)", intensity: "hard", vibe: "night cloud", author: "Rage", url: "https://p.scdn.co/mp3-preview/a9167885b5b481600f680c6f55518b5ea0f22d9b?cid=9448f212852243e8bb24765d70f2f354" },
            { name: "Gunship - Tech Noir", intensity: "chill", vibe: "code", author: "Cyberpunk", url: "https://p.scdn.co/mp3-preview/f82168926442654ef245e3540d0cbfa239d20c57?cid=9448f212852243e8bb24765d70f2f354" }
        ];

        const audio = new Audio();
        let currentPlaylist = [];
        let activeIndex = null;

        let selectedIntensity = 'chill';
        let selectedVibe = 'night';

        // Выбор кнопок конфигурации
        function setupSelector(containerId, callback) {
            const container = document.getElementById(containerId);
            container.querySelectorAll('.opt-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    container.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    callback(e.target.getAttribute('data-val'));
                });
            });
        }

        setupSelector('intensity-opts', (val) => selectedIntensity = val);
        setupSelector('vibe-opts', (val) => selectedVibe = val);

        document.getElementById('generate-btn').addEventListener('click', () => {
            const statusText = document.getElementById('status-text');
            statusText.textContent = "BUILDING";

            // Фильтрация базы треков по выбранным настройкам
            currentPlaylist = database.filter(track => {
                const matchIntensity = track.intensity === selectedIntensity;
                const matchVibe = track.vibe.includes(selectedVibe);
                return matchIntensity || matchVibe;
            });

            // Если под фильтр попало мало, берем рандом из общей базы
            if (currentPlaylist.length === 0) {
                currentPlaylist = [...database].sort(() => 0.5 - Math.random()).slice(0, 3);
            }

            activeIndex = null;
            renderTracks();
            statusText.textContent = "READY";
        });

        const tracklistEl = document.getElementById('tracklist');
        const cpTitle = document.getElementById('cp-title');
        const cpSub = document.getElementById('cp-sub');
        const masterPlayBtn = document.getElementById('master-play-btn');
        const statusText = document.getElementById('status-text');

        function renderTracks() {
            tracklistEl.innerHTML = '';
            currentPlaylist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'track-item';
                if (activeIndex === index) item.classList.add('playing');

                item.innerHTML = `
                    <div class="track-thumb">🎵</div>
                    <div class="track-info">
                        <div class="track-name">${track.name}</div>
                        <div class="track-meta">${track.author}</div>
                    </div>
                `;

                item.addEventListener('click', () => playTrack(index));
                tracklistEl.appendChild(item);
            });
        }

        function playTrack(index) {
            activeIndex = index;
            const track = currentPlaylist[index];

            audio.src = track.url;
            audio.play().then(() => {
                statusText.textContent = "PLAYING";
                cpTitle.textContent = track.name;
                cpSub.textContent = track.author;
                masterPlayBtn.textContent = "⏸";
                renderTracks();
            }).catch(e => console.error(e));
        }

        masterPlayBtn.addEventListener('click', () => {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                masterPlayBtn.textContent = "⏸";
                statusText.textContent = "PLAYING";
            } else {
                audio.pause();
                masterPlayBtn.textContent = "▶";
                statusText.textContent = "PAUSED";
            }
        });

        audio.addEventListener('ended', () => {
            masterPlayBtn.textContent = "▶";
            statusText.textContent = "READY";
            activeIndex = null;
            renderTracks();
        });

        // Анимация канваса
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let step = 0;
        function animate() {
            ctx.fillStyle = '#050507';
            ctx.fillRect(0, 0, width, height);

            const isPlaying = !audio.paused;
            step += isPlaying ? 0.04 : 0.008;

            ctx.lineWidth = 1.5;
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.strokeStyle = isPlaying ? `rgba(255, 42, 95, ${0.1 + i*0.04})` : `rgba(120, 120, 140, 0.04)`;
                
                for (let x = 0; x < width; x += 15) {
                    const y = height / 2 + Math.sin(x * 0.003 + step + i * 0.6) * (isPlaying ? 50 : 15);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            if (isPlaying) {
                document.querySelectorAll('.s-bar').forEach(bar => {
                    bar.style.height = `${Math.random() * 14 + 4}px`;
                });
            } else {
                document.querySelectorAll('.s-bar').forEach(bar => {
                    bar.style.height = `4px`;
                });
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
