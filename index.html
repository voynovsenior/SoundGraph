
 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FREQUENCY // Audio Engine v1.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;600;900&display=swap');

        :root {
            --bg: #050507;
            --surface: #101016;
            --surface-hover: #1a1a24;
            --border: #262636;
            --text: #f3f3f6;
            --muted: #78788c;
            --accent: #ff2a5f;
            --accent-glow: rgba(255, 42, 95, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 850px;
            background: rgba(16, 16, 22, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        /* Шапка */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: -0.5px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: var(--accent);
        }

        .sys-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            background: var(--surface);
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        /* Выбор жанра / вайба */
        .categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .cat-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .cat-btn:hover {
            border-color: var(--text);
            color: var(--text);
        }

        .cat-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--text);
        }

        /* Загрузка своих */
        .upload-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-custom {
            flex: 1;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-custom:hover {
            border-color: var(--accent);
            background: var(--surface-hover);
        }

        /* Список треков */
        .tracklist {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 2px;
        }

        .tracklist::-webkit-scrollbar {
            width: 3px;
        }
        .tracklist::-webkit-scrollbar-thumb {
            background: var(--border);
        }

        .track-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .track-item:hover {
            background: var(--surface-hover);
            border-color: var(--muted);
        }

        .track-item.playing {
            border-color: var(--accent);
            background: rgba(255, 42, 95, 0.05);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .track-thumb {
            width: 40px;
            height: 40px;
            background: var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .track-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .track-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .track-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--muted);
        }

        /* Контроллер плеера снизу */
        .player-bar {
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .play-master-btn {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: transform 0.1s;
        }

        .play-master-btn:active {
            transform: scale(0.95);
        }

        .current-playing-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .cp-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cp-status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* Спектрум-визуализатор */
        .spectrum {
            display: flex;
            gap: 2px;
            height: 16px;
            align-items: flex-end;
        }

        .s-bar {
            width: 3px;
            background: var(--accent);
            height: 4px;
            border-radius: 1px;
            transition: height 0.1s ease;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="app-shell">
        <div class="topbar">
            <div class="logo">FREQ<span>//</span>ENGINE</div>
            <div class="sys-status" id="status-text">IDLE</div>
        </div>

        <div class="categories">
            <button class="cat-btn active" data-cat="cloud">CLOUD</button>
            <button class="cat-btn" data-cat="phonk">PHONK</button>
            <button class="cat-btn" data-cat="ambient">AMBIENT</button>
        </div>

        <div class="upload-row">
            <input type="file" id="mp3-input" accept="audio/mp3, audio/wav" multiple hidden>
            <button class="btn-custom" id="upload-trigger">+ ЗАГРУЗИТЬ СВОИ MP3</button>
        </div>

        <div class="tracklist" id="tracklist">
            <!-- Треки рендерятся через JS -->
        </div>

        <div class="player-bar">
            <button class="play-master-btn" id="master-play-btn">▶</button>
            <div class="current-playing-info">
                <div class="cp-title" id="cp-title">Ничего не играет</div>
                <div class="cp-status" id="cp-sub">Выберите трек из списка</div>
            </div>
            <div class="spectrum" id="spectrum">
                <div class="s-bar"></div><div class="s-bar"></div><div class="s-bar"></div><div class="s-bar"></div><div class="s-bar"></div>
            </div>
        </div>
    </div>

    <script>
        // Реальные рабочие аудио-превью (бесплатные потоковые семплы для тестирования)
        const database = {
            cloud: [
                { name: "Yung Lean - Ginseng Strip (Snippet)", author: "Cloud Core", url: "https://p.scdn.co/mp3-preview/452295696d5a11c19550b07548ec2a55928d3e38?cid=9448f212852243e8bb24765d70f2f354" },
                { name: "Space Ghost Purrp - Bringin' The Phonk", author: "Underground", url: "https://p.scdn.co/mp3-preview/a9167885b5b481600f680c6f55518b5ea0f22d9b?cid=9448f212852243e8bb24765d70f2f354" }
            ],
            phonk: [
                { name: "Kordhell - Murder In My Mind (Drift)", author: "Drift Phonk", url: "https://p.scdn.co/mp3-preview/882e340e4fbc8ea9f9e30a514d7ca656f7ef534a?cid=9448f212852243e8bb24765d70f2f354" },
                { name: "DVRST - Close Eyes", author: "Phonk Wave", url: "https://p.scdn.co/mp3-preview/c8a245d8b8d946d84f2aa34b1235b2e3f5b08542?cid=9448f212852243e8bb24765d70f2f354" }
            ],
            ambient: [
                { name: "HOME - Resonance (Synthwave Core)", author: "Retrowave", url: "https://p.scdn.co/mp3-preview/32578b871c53e8392186835a297924d550089e1b?cid=9448f212852243e8bb24765d70f2f354" },
                { name: "Gunship - Tech Noir", author: "Cyberpunk", url: "https://p.scdn.co/mp3-preview/f82168926442654ef245e3540d0cbfa239d20c57?cid=9448f212852243e8bb24765d70f2f354" }
            ],
            local: []
        };

        const audio = new Audio();
        let currentCategory = 'cloud';
        let activeTrackIndex = null;

        const tracklistEl = document.getElementById('tracklist');
        const statusText = document.getElementById('status-text');
        const cpTitle = document.getElementById('cp-title');
        const cpSub = document.getElementById('cp-sub');
        const masterPlayBtn = document.getElementById('master-play-btn');

        // Рендер треков
        function renderTracks(category) {
            tracklistEl.innerHTML = '';
            const tracks = database[category];

            if(tracks.length === 0) {
                tracklistEl.innerHTML = '<div style="text-align:center; color:var(--muted); margin-top:40px; font-size:12px; font-family:JetBrains Mono;">НЕТ ФАЙЛОВ. ЗАГРУЗИТЕ СВОИ.</div>';
                return;
            }

            tracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'track-item';
                if (activeTrackIndex === index && currentCategory === category) {
                    item.classList.add('playing');
                }

                item.innerHTML = `
                    <div class="track-thumb">${category === 'local' ? '💾' : '🎵'}</div>
                    <div class="track-info">
                        <div class="track-name">${track.name}</div>
                        <div class="track-meta">${track.author}</div>
                    </div>
                `;

                item.addEventListener('click', () => {
                    playTrack(category, index);
                });

                tracklistEl.appendChild(item);
            });
        }

        function playTrack(cat, index) {
            currentCategory = cat;
            activeTrackIndex = index;
            const track = database[cat][index];

            audio.src = track.url;
            audio.play().then(() => {
                statusText.textContent = "PLAYING";
                cpTitle.textContent = track.name;
                cpSub.textContent = track.author;
                masterPlayBtn.textContent = "⏸";
                renderTracks(cat);
            }).catch(err => {
                console.error(err);
                alert("Ошибка воспроизведения потока. Попробуйте свои MP3 файлы.");
            });
        }

        // Переключение категорий
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.getAttribute('data-cat');
                activeTrackIndex = null;
                renderTracks(currentCategory);
            });
        });

        // Загрузка локальных файлов
        const uploadTrigger = document.getElementById('upload-trigger');
        const mp3Input = document.getElementById('mp3-input');

        uploadTrigger.addEventListener('click', () => mp3Input.click());

        mp3Input.addEventListener('change', (e) => {
            const files = e.target.files;
            if(!files.length) return;

            database.local = [];
            Array.from(files).forEach(file => {
                database.local.push({
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    author: "Local Storage",
                    url: URL.createObjectURL(file)
                });
            });

            // Создаем или активируем кнопку локал
            currentCategory = 'local';
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            renderTracks('local');
            uploadTrigger.textContent = `ЗАГРУЖЕНО: ${files.length}`;
        });

        // Кнопка Play/Pause снизу
        masterPlayBtn.addEventListener('click', () => {
            if(!audio.src) return;
            if(audio.paused) {
                audio.play();
                masterPlayBtn.textContent = "⏸";
                statusText.textContent = "PLAYING";
            } else {
                audio.pause();
                masterPlayBtn.textContent = "▶";
                statusText.textContent = "PAUSED";
            }
        });

        audio.addEventListener('ended', () => {
            masterPlayBtn.textContent = "▶";
            statusText.textContent = "IDLE";
            activeTrackIndex = null;
            renderTracks(currentCategory);
        });

        // --- ДИНАМИЧЕСКИЙ КАНВАС (ФОНОВЫЕ ВОЛНЫ) ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let step = 0;
        function drawCanvas() {
            ctx.fillStyle = '#050507';
            ctx.fillRect(0, 0, width, height);

            ctx.lineWidth = 1.5;
            const isPlaying = !audio.paused;
            step += isPlaying ? 0.03 : 0.005;

            // Рисуем сетку-волну
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.strokeStyle = isPlaying ? `rgba(255, 42, 95, ${0.08 + i*0.03})` : `rgba(120, 120, 140, 0.04)`;
                
                for (let x = 0; x < width; x += 15) {
                    const y = height / 2 + Math.sin(x * 0.003 + step + i * 0.5) * (isPlaying ? 60 : 20) 
                              + Math.cos(x * 0.008 - step) * (isPlaying ? 30 : 10);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // Анимация спектрума внизу
            if (isPlaying) {
                document.querySelectorAll('.s-bar').forEach((bar, idx) => {
                    bar.style.height = `${Math.random() * 14 + 4}px`;
                });
            } else {
                document.querySelectorAll('.s-bar').forEach(bar => {
                    bar.style.height = `4px`;
                });
            }

            requestAnimationFrame(drawCanvas);
        }
        drawCanvas();

        // Первичный рендер
        renderTracks('cloud');
    </script>
</body>
</html>
